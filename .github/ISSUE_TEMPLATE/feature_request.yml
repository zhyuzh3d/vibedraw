name: 功能建议
description: 为 VibeDraw 或 ComfyUI VibeDraw Plugin(CVP)提出建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议!请先描述你要解决的问题,再说你希望的方案。
        如果建议针对 CVP 插件,请在下方的相关范围里选中它。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 绘制与笔触
        - 选区与对象操作
        - 生图任务与参数
        - 历史作品
        - 导出
        - 模型接入
        - 界面与语言
        - ComfyUI VibeDraw Plugin(CVP)
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复建议。
          required: true
        - label: 我愿意在需要时提交 Pull Request。
          required: false
