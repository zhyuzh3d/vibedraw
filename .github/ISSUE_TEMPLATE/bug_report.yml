name: 缺陷报告
description: 报告 VibeDraw 的问题(绘图,成图,蒙版,历史作品,生图接口,CVP 插件等)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!请尽量把信息填全,方便定位。
        请不要粘贴真实 API Key,访问令牌或隐私图片。
  - type: input
    id: version
    attributes:
      label: VibeDraw 版本
      description: 见仓库 `hermit.json` 或应用内设置页显示的名称。
      placeholder: "例如 0.5.0"
    validations:
      required: true
  - type: input
    id: hermit-version
    attributes:
      label: Hermit 版本
      placeholder: "例如 1.11.0 (versionCode 80)"
    validations:
      required: true
  - type: input
    id: android-webview
    attributes:
      label: Android 与 WebView 版本
      placeholder: "例如 Android 12,WebView Chrome 83"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 所用接口模式
      options:
        - ComfyUI VibeDraw Plugin(CVP)
        - OpenAI Images 兼容
        - Stable Diffusion WebUI / Forge
        - Stability AI
        - 与生图无关(纯绘图 / 界面问题)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 VibeDraw,……
        2. 涂几笔 / 点某个按钮……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 有报错信息或截图请一并贴上,截图请打码隐私内容。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 绘制与笔触
        - 选区与对象操作
        - 局部蒙版
        - 快速生图 / 局部重绘 / 高清渲染
        - 历史作品
        - 导出与下载
        - 模型配置
        - 主题与语言
        - CVP 插件
        - 其他
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: CVP 插件版本(如适用)
      description: 插件使用 CVP 时,`GET /cvp/info` 返回的 `plugin.version` 是多少。
      placeholder: "例如 2.2.0"
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue,没有发现重复。
          required: true
        - label: 我提交的内容不包含真实 API Key,令牌或隐私图片。
          required: true
        - label: 如涉及真实出图,我已确认自己配置的服务与网络环境正常。
          required: false
