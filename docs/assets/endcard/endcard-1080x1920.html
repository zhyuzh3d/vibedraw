<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VibeDraw 片尾卡 1080x1920</title>
<style>
  :root{
    --app:#ff2b92;            /* VibeDraw 主色 (官网 styles.css --app) */
    --app-soft:#ff77ba;
    --ink:#ffffff;
    --dim:rgba(255,255,255,.58);
    --line:rgba(255,255,255,.13);
    --bg:#100a12;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  body{
    background:var(--bg);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
    color:var(--ink);position:relative;-webkit-font-smoothing:antialiased;
  }

  /* ---------- 背景: 只有无边界光晕, 不放有形状的水印 ---------- */
  .glow-a,.glow-b,.dots,.vign{position:absolute;pointer-events:none;}
  .glow-a{width:1800px;height:1800px;left:-360px;top:-680px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,43,146,.30) 0%,rgba(255,43,146,.10) 42%,rgba(255,43,146,0) 68%);}
  .glow-b{width:1600px;height:1600px;left:-260px;bottom:-780px;border-radius:50%;
    background:radial-gradient(circle,rgba(130,60,220,.20) 0%,rgba(130,60,220,.06) 45%,rgba(130,60,220,0) 70%);}
  .dots{inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.6px);
    background-size:54px 54px;opacity:.5;}
  .vign{inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(0,0,0,0) 30%,rgba(0,0,0,.52) 100%);}

  /* padding-bottom 留出页脚高度 ⇒ 主体在"页脚以上"的区域里真正居中 */
  .stage{position:relative;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 92px 200px;}

  /* ---------- 主品牌标 ---------- */
  .mark{width:260px;height:260px;border-radius:58px;background:var(--app);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 26px 84px rgba(255,43,146,.5),0 6px 22px rgba(0,0,0,.42);}
  .mark::after{content:"";position:absolute;inset:0;
    background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,0) 56%);}
  .mark svg{width:166px;height:166px;display:block;position:relative;}

  .word{margin-top:58px;font-size:136px;font-weight:800;letter-spacing:-2.5px;line-height:1;}
  .tag{margin-top:30px;font-size:58px;font-weight:600;color:var(--app-soft);letter-spacing:.5px;line-height:1.2;white-space:nowrap;}
  /* 英文副标: 白色 + 标准粗细 */
  .tag-en{margin-top:22px;font-size:34px;font-weight:400;color:#ffffff;letter-spacing:.4px;}

  .rule{margin-top:92px;width:700px;height:1px;
    background:linear-gradient(90deg,rgba(255,255,255,0),var(--line) 18%,var(--line) 82%,rgba(255,255,255,0));}

  /* ---------- CTA (安全版: 只讲站内动作) ---------- */
  .cta{margin-top:82px;display:flex;align-items:center;gap:30px;
    padding:38px 56px;border-radius:32px;
    background:linear-gradient(135deg,rgba(255,43,146,.18),rgba(255,43,146,.06));
    border:1.5px solid rgba(255,43,146,.46);box-shadow:0 16px 50px rgba(255,43,146,.15);}
  .cta svg{width:56px;height:56px;flex:0 0 auto;}
  .cta-main{font-size:52px;font-weight:700;letter-spacing:.5px;line-height:1.16;}
  .cta-sub{margin-top:12px;font-size:30px;font-weight:400;color:var(--dim);letter-spacing:.3px;}

  /* ---------- "运行在" 双 logo lockup ---------- */
  .lockup{margin-top:92px;display:flex;align-items:center;gap:48px;}
  .lk{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .lk-ico{width:104px;height:104px;border-radius:20px;display:flex;align-items:center;justify-content:center;}
  .lk-ico.v{background:var(--app);box-shadow:0 14px 38px rgba(255,43,146,.42);}
  .lk-ico.v svg{width:62px;height:62px;display:block;}
  /* Hermit 用官方图标本体(黑方 + 白 H); 深底上加一道极淡描边让方块轮廓读出来 */
  .lk-ico.h img{width:104px;height:104px;display:block;border-radius:19.6px;
    box-shadow:0 0 0 1.5px rgba(255,255,255,.22),0 14px 38px rgba(0,0,0,.5);}
  .lk-name{font-size:29px;font-weight:600;color:var(--dim);letter-spacing:.5px;}
  .lk-mid{font-size:29px;font-weight:500;color:rgba(255,255,255,.40);letter-spacing:1px;padding-bottom:49px;}

  /* ---------- 页脚两行 ---------- */
  .foot{position:absolute;left:0;right:0;bottom:78px;text-align:center;}
  .f1{font-size:28px;font-weight:500;color:rgba(255,255,255,.52);letter-spacing:1.2px;}
  .f2{margin-top:13px;font-size:35px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.6px;}
</style>
</head>
